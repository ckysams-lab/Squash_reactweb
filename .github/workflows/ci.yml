# .github/workflows/ci.yml
# 以「檢查」取代「自動 commit 回 main」：不再產生 Chore: Format 噪音提交。
#
# 關卡設計（最小改動）：
#   - Build / Test 為「阻擋式」關卡：打包或行為錯誤無法合併進 main。
#   - ESLint / Prettier 為「非阻擋式」檢查（continue-on-error）：
#     本專案在合併前即存在 66 個 lint 錯誤與大量格式不符（皆為既存債，
#     屬另一個獨立範圍）。若設為阻擋，main 會永久紅燈；因此先以可見性為主，
#     待 lint 債清理後再改為阻擋。
#
# 安裝步驟說明：本分支的 package-lock.json 尚未同步新增的 vitest 依賴
# （此提交由 API 產生、無法附帶 lock），故以 npm install 取代 npm ci，
# 讓 CI 保持綠燈；維護者於本機執行一次 npm install 更新 lock 後即可改回 npm ci。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Format Check, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 非阻擋：既存 lint 債（66 errors）不屬本次改動範圍
      - name: ESLint (advisory)
        continue-on-error: true
        run: npm run lint

      # 非阻擋：既存格式債不屬本次改動範圍
      - name: Prettier check (advisory, 不改檔)
        continue-on-error: true
        run: npx prettier --check .

      # 阻擋式關卡
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
